<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natsarut-UTCC | Dashboard</title>
  <style>
    :root { --glass: rgba(255, 255, 255, 0.9); }
    body { 
      font-family: sans-serif; 
      margin: 0; 
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                  url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    header { color: white; padding: 1.5rem 0; text-align: center; }
    /* ขยายความกว้างรวมของหน้าจอ */
    main { width: min(1200px, 95%); margin: 1rem auto; }
    .hero { text-align: center; padding: 3rem 1rem; background: var(--glass); border-radius: 1.5rem; backdrop-filter: blur(15px); }
    
    .btn { 
      background: #2563eb; color: white; padding: 12px 0; border-radius: 10px; 
      text-decoration: none; display: block; font-weight: bold; border: none; 
      cursor: pointer; transition: 0.3s; width: 100%; text-align: center; box-sizing: border-box;
    }
    .btn:hover { background: #1d4ed8; transform: scale(1.02); }
    
    /* ปรับ Layout ให้ PDF กินพื้นที่มากขึ้น */
    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
    
    .file-item { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.8); margin-bottom: 8px; border-radius: 10px; backdrop-filter: blur(5px); }
    
    /* ขยาย PDF Viewer ให้สูงและกว้างขึ้น */
    .pdf-viewer { width: 100%; height: 75vh; border-radius: 1rem; border: none; background: white; }
    .glass-box { background: var(--glass); padding: 1.2rem; border-radius: 1.5rem; backdrop-filter: blur(15px); }
  </style>
</head>
<body>
  <header><h1>Natsarut-UTCC Dashboard</h1></header>
  <main>
    <section id="home" class="page active">
      <div class="hero">
        <h1>ยินดีต้อนรับ</h1>
        <p>ระบบจัดการเอกสารดิจิทัลส่วนตัว</p>
        <button class="btn" style="width: auto; padding: 12px 24px; margin: 0 auto;" onclick="document.getElementById('home').style.display='none'; document.getElementById('work').style.display='block';">ดูไฟล์ส่งงาน</button>
      </div>
    </section>

    <section id="work" class="page" style="display:none;">
      <div class="layout">
        <aside class="glass-box">
          <h3 style="margin-top:0;">รายการไฟล์ PDF</h3>
          <div id="fileList">กำลังโหลด...</div>
          <br>
          <a href="https://github.com/natsarutariyautcc-cmd/Natsarut-UTCC/tree/main/files" class="btn" target="_blank">+ อัปโหลดไฟล์ PDF</a>
        </aside>
        <section class="glass-box">
          <h3 id="currentFile" style="margin-top:0;">เลือกไฟล์เพื่อดู</h3>
          <iframe id="pdfViewer" class="pdf-viewer" hidden></iframe>
          <br>
          <a id="openNewTab" href="#" target="_blank" hidden style="color:#2563eb; font-weight:bold;">เปิดไฟล์ในแท็บใหม่ ↗</a>
        </section>
      </div>
    </section>
  </main>

  <script>
    async function fetchFiles() {
      const list = document.getElementById('fileList');
      try {
        const res = await fetch('https://api.github.com/repos/natsarutariyautcc-cmd/Natsarut-UTCC/contents/files');
        const files = await res.json();
        list.innerHTML = '';
        files.filter(f => f.name.toLowerCase().endsWith('.pdf')).forEach(f => {
          list.innerHTML += `
            <div class="file-item">
              <span style="cursor:pointer; color:#2563eb; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" onclick="viewPdf('${f.download_url}', '${f.name}')">${f.name}</span>
            </div>`;
        });
      } catch (e) { list.innerHTML = 'ไม่พบไฟล์'; }
    }

    function viewPdf(url, name) {
      document.getElementById('currentFile').innerText = name;
      const rawUrl = url.replace('api.github.com/repos/', 'raw.githubusercontent.com/')
                        .replace('/contents/', '/')
                        .split('?')[0];
      const viewer = document.getElementById('pdfViewer');
      viewer.src = `https://docs.google.com/viewer?url=${encodeURIComponent(rawUrl)}&embedded=true`;
      viewer.hidden = false;
      const link = document.getElementById('openNewTab');
      link.href = rawUrl;
      link.hidden = false;
    }
    fetchFiles();
  </script>
</body>
</html>
