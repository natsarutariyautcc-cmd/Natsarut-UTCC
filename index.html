<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>AI101 | ส่งงาน</title>
  <style>
    body { font-family: sans-serif; background: #f4f7f6; padding: 20px; line-height: 1.6; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn { background: #2563eb; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold; }
    .file-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

<div class="container">
  <h1>รายการไฟล์ส่งงาน</h1>
  
  <!-- ลิงก์นี้จะพาคุณไปที่หน้าโฟลเดอร์ files ใน GitHub โดยตรง (ไม่ติด 404) -->
  <a href="https://github.com/natsarutariyautcc-cmd/websiteNatsarutAI101/tree/main/files" class="btn" target="_blank">
    + อัปโหลดไฟล์ (กดปุ่ม Add file ด้านใน)
  </a>

  <div id="fileList" style="margin-top:20px;">กำลังโหลดไฟล์...</div>
</div>

<script>
  async function loadFiles() {
    try {
      const res = await fetch('https://api.github.com/repos/natsarutariyautcc-cmd/websiteNatsarutAI101/contents/files');
      const data = await res.json();
      const list = document.getElementById('fileList');
      list.innerHTML = '';
      data.filter(f => f.name.endsWith('.pdf')).forEach(f => {
        list.innerHTML += `
          <div class="file-item">
            <a href="${f.download_url}" target="_blank">${f.name}</a>
            <a href="${f.html_url}" target="_blank" style="color:red;">จัดการ</a>
          </div>`;
      });
    } catch (e) { list.innerHTML = "ไม่พบไฟล์ หรือยังไม่มีไฟล์ในโฟลเดอร์"; }
  }
  loadFiles();
</script>

</body>
</html>
