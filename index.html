<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI101 | เว็บไซต์ส่งงาน</title>
  <style>
    :root { --blue: #2563eb; --blue-dark: #1d4ed8; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.6; }
    header { background: #fff; border-bottom: 1px solid var(--border); padding: 1rem 0; }
    nav { width: 90%; max-width: 1000px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
    .nav-btn { background: none; border: none; cursor: pointer; font-weight: bold; padding: 10px; }
    main { width: 90%; max-width: 1000px; margin: 2rem auto; min-height: 60vh; }
    .page { display: none; } .page.active { display: block; }
    .hero { text-align: center; padding: 4rem 1rem; }
    .btn { background: var(--blue); color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block; font-weight: bold; }
    .btn:hover { background: var(--blue-dark); }
    .container { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }
    .file-list { list-style: none; padding: 0; }
    .file-item { background: white; padding: 10px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .viewer { width: 100%; height: 600px; border: 1px solid var(--border); background: white; margin-top: 10px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <nav>
    <h2>AI101</h2>
    <div>
      <button class="nav-btn" onclick="showPage('home')">Home</button>
      <button class="nav-btn" onclick="showPage('work')">ส่งงาน</button>
    </div>
  </nav>
</header>

<main>
  <section id="home" class="page active">
    <div class="hero">
      <h1>ยินดีต้อนรับสู่เว็บไซต์ส่งงาน</h1>
      <button class="btn" onclick="showPage('work')">ดูไฟล์ส่งงาน</button>
    </div>
  </section>

  <section id="work" class="page">
    <div class="container">
      <aside>
        <h3>รายการไฟล์ PDF</h3>
        <ul id="fileList" class="file-list"><li>กำลังโหลด...</li></ul>
        <!-- เปลี่ยนลิงก์ให้เข้าโฟลเดอร์โดยตรง เพื่อเลี่ยงปัญหา 404 -->
        <a id="uploadBtn" href="https://github.com/natsarutariyautcc-cmd/websiteNatsarutAI101/tree/main/files" class="btn" target="_blank" style="width:100%; text-align:center;">+ ไปที่หน้าอัปโหลดไฟล์</a>
      </aside>
      <section>
        <h3 id="fileName">เลือกไฟล์จากรายการ</h3>
        <iframe id="pdfViewer" class="viewer" hidden></iframe>
        <a id="openTab" href="#" target="_blank" hidden style="display:block; margin-top:10px;">เปิดไฟล์ในแท็บใหม่ ↗</a>
      </section>
    </div>
  </section>
</main>

<script>
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  async function loadFiles() {
    const list = document.getElementById('fileList');
    try {
      // ใช้ URL ของ GitHub API โดยตรง
      const res = await fetch(`https://api.github.com/repos/natsarutariyautcc-cmd/websiteNatsarutAI101/contents/files`);
      const data = await res.json();
      list.innerHTML = '';
      
      if (Array.isArray(data)) {
        data.filter(f => f.name.toLowerCase().endsWith('.pdf')).forEach(f => {
          const li = document.createElement('li');
          li.className = 'file-item';
          li.innerHTML = `
            <button onclick="viewPdf('${f.download_url}', '${f.name}')" style="border:none; background:none; cursor:pointer; font-weight:bold;">${f.name}</button>
            <a href="${f.html_url}" target="_blank" style="font-size:0.8rem;">จัดการ</a>
          `;
          list.appendChild(li);
        });
      }
    } catch (e) {
      list.innerHTML = '<li>โหลดไฟล์ไม่สำเร็จ (ตรวจสอบชื่อโฟลเดอร์)</li>';
    }
  }

  function viewPdf(url, name) {
    document.getElementById('fileName').innerText = name;
    const viewer = document.getElementById('pdfViewer');
    viewer.src = url;
    viewer.hidden = false;
    const tab = document.getElementById('openTab');
    tab.href = url;
    tab.hidden = false;
  }

  loadFiles();
</script>

</body>
</html>
