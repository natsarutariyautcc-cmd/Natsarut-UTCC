<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Natsarut-UTCC | Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop'); background-size: cover; background-attachment: fixed; min-height: 100vh; }
    .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); }
  </style>
</head>
<body class="p-4 md:p-8">

<header class="max-w-6xl mx-auto mb-8 text-white flex justify-between items-end">
  <h1 class="text-4xl font-black italic">Natsarut-UTCC</h1>
  <button onclick="addSubject()" class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded-full font-bold transition">+ เพิ่มวิชาใหม่</button>
</header>

<main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-6">
  <!-- รายการวิชา -->
  <div id="subjectList" class="md:col-span-1 space-y-4">
    <!-- วิชาจะถูกโหลดมาแสดงที่นี่ -->
  </div>

  <!-- แสดงไฟล์ในวิชานั้นๆ -->
  <div class="md:col-span-3 glass p-6 rounded-3xl shadow-2xl">
    <div id="fileArea" class="hidden">
      <h2 id="subjectTitle" class="text-2xl font-bold mb-4 text-blue-900">ชื่อวิชา</h2>
      <div id="fileList" class="grid grid-cols-1 gap-2 mb-6"></div>
      <a id="uploadLink" href="#" target="_blank" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-700">⬆ อัปโหลดไฟล์ในวิชานี้</a>
    </div>
    <div id="welcome" class="text-center py-20 text-gray-500">เลือกวิชาจากด้านซ้ายเพื่อดูไฟล์</div>
  </div>
</main>

<script>
  const GITHUB_API = 'https://api.github.com/repos/natsarutariyautcc-cmd/Natsarut-UTCC/contents/files';

  async function fetchSubjects() {
    const res = await fetch(GITHUB_API);
    const data = await res.json();
    const subjectList = document.getElementById('subjectList');
    subjectList.innerHTML = '';
    
    data.filter(item => item.type === 'dir').forEach(dir => {
      subjectList.innerHTML += `
        <div class="glass p-4 rounded-2xl cursor-pointer hover:bg-blue-50 transition border-l-4 border-blue-500" 
             onclick="loadFiles('${dir.name}')">
          <p class="font-bold text-gray-800">${dir.name}</p>
        </div>`;
    });
  }

  async function loadFiles(subject) {
    document.getElementById('welcome').classList.add('hidden');
    document.getElementById('fileArea').classList.remove('hidden');
    document.getElementById('subjectTitle').innerText = subject;
    document.getElementById('uploadLink').href = `https://github.com/natsarutariyautcc-cmd/Natsarut-UTCC/upload/main/files/${subject}`;
    
    const res = await fetch(`${GITHUB_API}/${subject}`);
    const files = await res.json();
    const list = document.getElementById('fileList');
    list.innerHTML = files.filter(f => f.name.endsWith('.pdf')).map(f => `
      <div class="p-3 bg-white border rounded-lg flex justify-between">
        <span>${f.name}</span>
        <a href="${f.download_url}" target="_blank" class="text-blue-600 font-bold">เปิดอ่าน</a>
      </div>
    `).join('');
  }

  function addSubject() {
    const name = prompt("ระบุชื่อวิชาใหม่:");
    if(name) window.open(`https://github.com/natsarutariyautcc-cmd/Natsarut-UTCC/new/main/files/${name}?filename=.keep`);
  }

  fetchSubjects();
</script>
</body>
</html>
