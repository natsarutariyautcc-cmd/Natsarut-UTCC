<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI101 | เว็บไซต์ส่งงาน</title>
  <style>
    :root { --blue: #2563eb; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    header { background: #1e3a8a; color: white; padding: 1.5rem 0; text-align: center; }
    main { width: min(1000px, 92%); margin: 2rem auto; }
    .hero { text-align: center; padding: 3rem 1rem; background: white; border-radius: 1rem; border: 1px solid var(--border); }
    .btn { background: var(--blue); color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-block; font-weight: bold; border: none; cursor: pointer; }
    .layout { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
    .file-item { display: flex; justify-content: space-between; padding: 10px; background: white; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; }
    .pdf-viewer { width: 100%; height: 600px; border: 1px solid var(--border); background: white; }
  </style>
</head>
<body>
  <header><h1>AI101 ส่งงาน</h1></header>
  <main>
    <section id="home" class="page active">
      <div class="hero">
        <h1>ยินดีต้อนรับ</h1>
        <button class="btn" onclick="document.getElementById('home').style.display='none'; document.getElementById('work').style.display='block';">ดูไฟล์ส่งงาน</button>
      </div>
    </section>

    <section id="work" class="page" style="display:none;">
      <div class="layout">
        <aside>
          <h3>รายการไฟล์ PDF</h3>
          <div id="fileList">กำลังโหลด...</div>
          <br>
          <a href="https://github.com/natsarutariyautcc-cmd/Natsarut-UTCC/upload/main/files" class="btn" target="_blank" style="width:100%; text-align:center;">+ อัปโหลดไฟล์ PDF</a>
        </aside>
        <section>
          <h3 id="currentFile">เลือกไฟล์เพื่อดู</h3>
          <iframe id="pdfViewer" class="pdf-viewer" hidden></iframe>
          <br>
          <a id="openNewTab" href="#" target="_blank" hidden>เปิดไฟล์ในแท็บใหม่ ↗</a>
        </section>
      </div>
    </section>
  </main>

  <script>
    async function fetchFiles() {
      const list = document.getElementById('fileList');
      try {
        const res = await fetch('https://api.github.com/repos/natsarutariyautcc-cmd/Natsarut-UTCC/contents/files');
        const files = await res.json();
        list.innerHTML = '';
        files.filter(f => f.name.toLowerCase().endsWith('.pdf')).forEach(f => {
          list.innerHTML += `
            <div class="file-item">
              <span style="cursor:pointer; color:#2563eb; font-weight:bold;" onclick="viewPdf('${f.download_url}', '${f.name}')">${f.name}</span>
              <a href="${f.html_url}" target="_blank" style="font-size:0.8rem;">จัดการ</a>
            </div>`;
        });
      } catch (e) { list.innerHTML = 'ไม่พบไฟล์'; }
    }

    function viewPdf(url, name) {
      document.getElementById('currentFile').innerText = name;
      const viewer = document.getElementById('pdfViewer');
      // ใช้ Google Docs Viewer เพื่อดูไฟล์ได้ทันทีโดยไม่โหลดลงเครื่อง
      viewer.src = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
      viewer.hidden = false;
      const link = document.getElementById('openNewTab');
      link.href = url;
      link.hidden = false;
    }

    fetchFiles();
  </script>
</body>
</html>
